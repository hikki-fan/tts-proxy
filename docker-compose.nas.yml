services:
  mimo-tts-proxy:
    image: limairui/mimo-tts-proxy:latest
    container_name: mimo-tts-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"        # 左边是 NAS 对外端口，可改成 7777:3000
    environment:
      - MIMO_API_KEY=      # 填入你的 MiMo API Key
      - PUBLIC_BASE_URL=   # 填入对外访问地址，如 https://tts.hikki.plus:7777
      - DATA_DIR=/data
      - CACHE_DIR=/data/cache
      # 可选项（留空则使用默认值）
      # - DEFAULT_VOICE=mimo_default
      # - DEFAULT_FORMAT=mp3
      # - DEFAULT_SPEED=1
      # - ACCESS_TOKEN=     # 阅读端访问鉴权 Token
      # - ADMIN_TOKEN=      # 管理界面 Token
      # - CACHE_MAX_ITEMS=500
      # - REQUEST_TIMEOUT_MS=120000
    volumes:
      - ./data:/data       # 持久化：音色配置、缓存、设置
